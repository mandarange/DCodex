[package]
name = "sks-core"
version = "9.0.1"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
globset = "0.4"
memmap2 = "0.9"

[[bin]]
name = "sks-rs"
path = "src/main.rs"
